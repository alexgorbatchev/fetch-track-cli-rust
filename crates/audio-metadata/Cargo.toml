[package]
name = "audio-metadata"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Audio recognition, metadata providers and atomic native tag editing"

[dependencies]
audio-chromaprint = { git = "https://github.com/alexgorbatchev/chromaprint-rust.git", rev = "3a4dc41e907b031ff6932ad322756a2623470fbf" }
cli-deps = { git = "https://github.com/alexgorbatchev/deps-rust.git", rev = "6aef62e44a87f65d31283a77b93925f456362069" }
shazam-client = { git = "https://github.com/alexgorbatchev/shazam-rust.git", rev = "045a7341bdc14613848e616feb3d5f7bc38e5bab" }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
lofty = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
unicode-normalization = "0.1"
which = "8"

[dev-dependencies]
axum = "0.8"

