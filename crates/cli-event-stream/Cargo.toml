[package]
name = "cli-event-stream"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Cancellable NDJSON events over native CLI sockets and descriptors"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
